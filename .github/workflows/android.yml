
name: Build J Studio APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract project ZIP
        run: unzip J-Studio.zip

      - name: Build APK
        run: gradle --no-daemon -p J-Studio assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: J-Studio-APK
          path: J-Studio/app/build/outputs/apk/debug/app-debug.apk
          
